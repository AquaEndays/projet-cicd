name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Deploy with Docker Compose (WebApp, Prometheus, Grafana)
        run: |
          docker compose up -d --build

      - name: Verify running containers
        run: |
          docker compose ps
